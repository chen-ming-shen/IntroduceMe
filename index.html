  <script>
    fetch('./local.md')
      .then(res => {
        if (!res.ok) throw new Error('文件读取失败');
        return res.text();
      })
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
      })
      .catch(err => {
        document.getElementById('content').innerHTML = `<p style="color:red;">加载失败：${err.message}</p>`;
      });
